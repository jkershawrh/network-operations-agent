schema_version: quickstart.redhat.com/benchmark-rubric/v1
version: "0.2"
description: No performance claim; target-model wording and seat capacity require measured review.
verification_policy:
  verified_means: Measured in the target environment with the model and workload recorded.
  public_claim_rules:
    - Do not publish scale, latency, or hardware-acceleration claims from fixture tests.
benchmarks:
  - id: hardware-explanation-quality
    scenario: ptp-hardware
    review_document: docs/model-quality-rubric.md
    proposed_minimum_score: 7
    maximum_score: 8
    required: true
    status: limited_direct_model_review
  - id: platform-explanation-quality
    scenario: ptp-platform
    review_document: docs/model-quality-rubric.md
    proposed_minimum_score: 7
    maximum_score: 8
    required: true
    status: limited_direct_model_review
  - id: launchpad-seat-capacity
    sequence: [1, 5, 25]
    required: true
    status: unmeasured
