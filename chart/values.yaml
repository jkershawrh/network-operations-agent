image:
  # Replace with an immutable image reference that your cluster can pull.
  repository: network-operations-agent
  tag: local
  digest: ""
  pullPolicy: IfNotPresent
  # Optional existing namespace-local Secret for a private registry image.
  pullSecret: ""

model:
  # Optional pre-existing Secret. Launchpad creates this per seat.
  existingSecret: ""
  # Presenter-visible placement label. Set only after cluster-side verification.
  runtimeLabel: "placement unverified"
  secretKeys:
    endpoint: endpoint
    name: name
    apiKey: api-key

route:
  # Keep the portable quickstart private by default. Launchpad enables this
  # for the participant workspace after applying its exposure policy.
  enabled: false
  name: ""

lab:
  # Enables learner-supplied synthetic scenarios and reliability qualification.
  # Keep false for the short quickstart catalog item.
  enabled: false

resources:
  requests:
    cpu: 50m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi
