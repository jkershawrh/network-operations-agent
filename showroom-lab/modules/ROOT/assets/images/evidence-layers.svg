<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="590" viewBox="0 0 1200 590" role="img" aria-labelledby="title desc">
  <title id="title">Four layers from observation to authorized action</title><desc id="desc">The lab separates current observations, historical context, deterministic inference, and human-authorized action. Each layer has different trust and failure behavior.</desc>
  <defs><style>.t{font:600 21px sans-serif;fill:#151515}.s{font:16px sans-serif;fill:#3c3f42}.n{font:700 30px sans-serif;fill:#fff}.a{stroke:#151515;stroke-width:3;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#151515"/></marker></defs>
  <rect width="1200" height="590" fill="#fafafa"/><text x="600" y="42" text-anchor="middle" class="t" font-size="27">Do not collapse evidence, context, inference, and authority</text>
  <g transform="translate(35 105)"><rect width="250" height="340" rx="12" fill="#e7f1fa" stroke="#0066cc" stroke-width="3"/><circle cx="40" cy="42" r="25" fill="#0066cc"/><text x="40" y="52" text-anchor="middle" class="n">1</text><text x="78" y="50" class="t">Observe</text><text x="25" y="95" class="s">Current tool output</text><text x="25" y="128" class="s">• timestamp</text><text x="25" y="157" class="s">• provenance</text><text x="25" y="186" class="s">• exact signal</text><text x="25" y="238" class="t" font-size="17">Failure behavior</text><text x="25" y="270" class="s">Missing required tool</text><text x="25" y="297" class="s">forces abstention.</text></g>
  <g transform="translate(330 105)"><rect width="250" height="340" rx="12" fill="#f3faf2" stroke="#3e8635" stroke-width="3"/><circle cx="40" cy="42" r="25" fill="#3e8635"/><text x="40" y="52" text-anchor="middle" class="n">2</text><text x="78" y="50" class="t">Contextualize</text><text x="25" y="95" class="s">Approved history</text><text x="25" y="128" class="s">• source ID</text><text x="25" y="157" class="s">• source revision</text><text x="25" y="186" class="s">• relevant excerpt</text><text x="25" y="238" class="t" font-size="17">Failure behavior</text><text x="25" y="270" class="s">Diagnosis may continue,</text><text x="25" y="297" class="s">but records the gap.</text></g>
  <g transform="translate(625 105)"><rect width="250" height="340" rx="12" fill="#fff4e5" stroke="#f0ab00" stroke-width="3"/><circle cx="40" cy="42" r="25" fill="#f0ab00"/><text x="40" y="52" text-anchor="middle" class="n">3</text><text x="78" y="50" class="t">Infer</text><text x="25" y="95" class="s">Bounded policy</text><text x="25" y="128" class="s">• supported cause</text><text x="25" y="157" class="s">• evidence IDs</text><text x="25" y="186" class="s">• explicit unknowns</text><text x="25" y="238" class="t" font-size="17">Failure behavior</text><text x="25" y="270" class="s">Conflicting signals</text><text x="25" y="297" class="s">become inconclusive.</text></g>
  <g transform="translate(920 105)"><rect width="250" height="340" rx="12" fill="#f5f5f5" stroke="#6a6e73" stroke-width="3"/><circle cx="40" cy="42" r="25" fill="#6a6e73"/><text x="40" y="52" text-anchor="middle" class="n">4</text><text x="78" y="50" class="t">Authorize</text><text x="25" y="95" class="s">Human decision</text><text x="25" y="128" class="s">• review evidence</text><text x="25" y="157" class="s">• request next test</text><text x="25" y="186" class="s">• reject recommendation</text><text x="25" y="238" class="t" font-size="17">Safety invariant</text><text x="25" y="270" class="s">The lab never executes</text><text x="25" y="297" class="s">network remediation.</text></g>
  <path d="M285 275 H325" class="a"/><path d="M580 275 H620" class="a"/><path d="M875 275 H915" class="a"/><text x="600" y="525" text-anchor="middle" class="s">An LLM may explain a supported inference; it cannot promote context into fact or recommendation into authority.</text>
</svg>
