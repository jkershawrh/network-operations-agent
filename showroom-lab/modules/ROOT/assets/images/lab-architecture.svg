<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">Evidence-backed network operations agent architecture</title>
  <desc id="desc">A synthetic NOC alarm flows through an OpenShift-hosted orchestrator to four read-only MCP diagnostics and approved historical knowledge. Deterministic policy creates an evidence ledger, an optional CPU model drafts wording, and a human operator approves the next diagnostic action.</desc>
  <defs><style>.box{fill:#fff;stroke:#151515;stroke-width:2}.platform{fill:#eef8ff;stroke:#0066cc;stroke-width:3}.safe{fill:#f3faf2;stroke:#3e8635;stroke-width:2}.model{fill:#fff4e5;stroke:#f0ab00;stroke-width:2}.t{font:600 20px sans-serif;fill:#151515}.s{font:15px sans-serif;fill:#3c3f42}.a{stroke:#0066cc;stroke-width:3;fill:none;marker-end:url(#m)}.d{stroke:#6a6e73;stroke-width:2;stroke-dasharray:7 5;fill:none;marker-end:url(#g)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0066cc"/></marker><marker id="g" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#6a6e73"/></marker></defs>
  <rect width="1200" height="680" fill="#fafafa"/>
  <text x="600" y="38" text-anchor="middle" class="t" font-size="26">Evidence-backed diagnosis on Red Hat OpenShift</text>
  <rect x="30" y="250" width="170" height="120" rx="8" class="box"/><text x="115" y="290" text-anchor="middle" class="t">Synthetic NOC</text><text x="115" y="318" text-anchor="middle" class="t">alarm</text><text x="115" y="347" text-anchor="middle" class="s">PTP holdover event</text>
  <rect x="235" y="85" width="700" height="520" rx="14" class="platform"/><text x="260" y="120" class="t">OpenShift participant namespace</text>
  <rect x="280" y="160" width="250" height="125" rx="8" class="box"/><text x="405" y="197" text-anchor="middle" class="t">Agent orchestrator</text><text x="405" y="227" text-anchor="middle" class="s">bounded workflow</text><text x="405" y="251" text-anchor="middle" class="s">no remediation permission</text>
  <rect x="610" y="145" width="275" height="165" rx="8" class="safe"/><text x="748" y="180" text-anchor="middle" class="t">Read-only MCP tools</text><text x="635" y="211" class="s">• network timing</text><text x="635" y="235" class="s">• OpenShift timing service</text><text x="635" y="259" class="s">• NIC timestamp health</text><text x="635" y="283" class="s">• upstream clock health</text>
  <rect x="280" y="370" width="250" height="115" rx="8" class="safe"/><text x="405" y="406" text-anchor="middle" class="t">Approved history</text><text x="405" y="435" text-anchor="middle" class="s">versioned synthetic runbooks</text><text x="405" y="459" text-anchor="middle" class="s">and incident excerpts</text>
  <rect x="610" y="365" width="275" height="130" rx="8" class="box"/><text x="748" y="401" text-anchor="middle" class="t">Evidence ledger</text><text x="748" y="430" text-anchor="middle" class="s">observations + provenance</text><text x="748" y="454" text-anchor="middle" class="s">hypothesis + unknowns</text><text x="748" y="478" text-anchor="middle" class="s">human approval required</text>
  <rect x="960" y="130" width="210" height="120" rx="8" class="model"/><text x="1065" y="168" text-anchor="middle" class="t">Optional model</text><text x="1065" y="198" text-anchor="middle" class="s">CPU inference</text><text x="1065" y="222" text-anchor="middle" class="s">drafts wording only</text>
  <rect x="960" y="390" width="210" height="125" rx="8" class="box"/><text x="1065" y="428" text-anchor="middle" class="t">NOC operator</text><text x="1065" y="458" text-anchor="middle" class="s">reviews evidence</text><text x="1065" y="482" text-anchor="middle" class="s">owns next action</text>
  <path d="M200 310 H280" class="a"/><path d="M530 220 H610" class="a"/><path d="M610 278 C555 310 550 410 530 425" class="d"/><path d="M530 425 H610" class="a"/><path d="M885 430 H960" class="a"/><path d="M885 385 C940 320 960 250 960 215" class="d"/><path d="M960 230 C920 285 900 330 830 365" class="d"/>
  <text x="595" y="642" text-anchor="middle" class="s">Solid arrows: required evidence path • Dashed arrows: optional context or explanation path</text>
</svg>
