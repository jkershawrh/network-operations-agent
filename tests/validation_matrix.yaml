    criteria:
      distinct_causes: "Hardware and platform scenarios lead to distinct supported hypotheses."
      abstention: "Missing, cross-scope, or conflicting diagnostics cannot produce a confident cause."
      human_review: "Every result requires approval and never executes an action."
  stage_3_integration:
    state: local_mcp_and_direct_model_synthetic_only
    criteria:
      http_journey: "Local page and API serve synthetic investigations."
      mcp_transport: "Synthetic diagnostics pass through official SDK Streamable HTTP locally."
      retrieval: "Approved excerpts rank from present MCP observations rather than scenario preselection."
      human_review: "Simulated review returns a decision without persistence or action."
      model_client: "Mock OpenAI-compatible response may only add unverified wording citing supporting evidence."
      live_tools_and_model: "Synthetic MCP diagnostics tested locally and on OpenShift. Direct RACMaaS CPU-labeled Granite 8B reviewed on both fixtures; backend CPU placement, tenant gateway, and live network tools not verified."
  stage_4_benchmarks:
    state: two_fixture_model_review_no_performance_claims
    criteria:
      target_model: "Run assigned model against both scenarios and human-review its wording."
      target_capacity: "No throughput, latency, or concurrency claim until measured."
  stage_5_publication:
    state: draft
    criteria:
      ownership_and_intake: "Reviewed source repo, confirmed owner and license, and completed quickstart intake."
