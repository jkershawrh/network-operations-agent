api_version: network-operations-agent.quickstart/v0.1
status: launchpad-source-ready-draft
identity:
  source_name: network-operations-agent
  audience_profile: core-network-ops
  first_event_profile: imc-telco

user_journey:
  objective: >-
    Investigate a synthetic network alarm using read-only MCP diagnostics and
    retrieved historical context, then review a recommendation.
  expected_duration_minutes: 35  # Planning target, not a measured completion time.
  steps:
    - inspect_alarm_and_kpis
    - discover_and_call_diagnostic_tools
    - retrieve_runbook_and_incident_context
    - compare_evidence_and_generate_hypotheses
    - review_recommended_next_action
  output_required:
    - investigation_id
    - alarm_id
    - current_observations_with_tool_provenance
    - historical_context_with_source_revision
    - primary_hypothesis
    - alternate_hypotheses
    - unknowns_and_conflicts
    - next_discriminating_test
    - proposed_action
    - action_requires_human_approval
  forbidden_claims:
    - autonomous_resolution
    - measured_mttr_improvement_without_comparison
    - measured_truck_roll_reduction_without_comparison
    - customer_specific_sizing_or_performance_without_evidence

interfaces:
  alarm_provider:
    request: scenario_id
    response: [alarm_id, occurred_at, domain, severity, kpis, fixture_revision]
  diagnostic_tool:
    transport: mcp
    request: [investigation_id, alarm_id, scope]
    response: [tool_id, status, observed_at, observations, provenance]
    scopes: [network, openshift_platform, hardware]
    mutation_allowed: false
  knowledge_provider:
    request: [investigation_id, query, source_allowlist]
    response: [source_id, source_revision, excerpt, relevance]
    approved_sources_only: true
  model_client:
    protocol: openai-compatible
    runtime_secret_required: true
    swappable: true
  review_decision:
    values: [approve_recommendation, request_more_evidence, reject]
    executes_action: false

deployment_constraints:
  default_scope: local-container-or-namespace
  cluster_scoped_access: false
  real_network_access: false
  customer_data: false
  remediation_execution: false
  model_hosting: optional_external_service
  model_name: null  # Launchpad supplies the selected model through a Secret.
  resources: unmeasured
  images: source_build_and_private_registry_proof
  launchpad:
    guided_content: showroom
    application_route: opt_in
    model_secret_keys: [endpoint, name, api-key]
    ordered_seat_certification: not_run

profiles:
  core-network-ops:
    may_change: [narrative, examples, vocabulary, synthetic_fixtures]
  imc-telco:
    derives_from: core-network-ops
    may_change: [narrative, examples, vocabulary, synthetic_fixtures]
    must_not_change: [permissions, model, images, resource_envelope, action_authority]
