schema_version: quickstart.redhat.com/validation-matrix/v1
stages:
  - id: stage-0-contracts
    name: Contracts and evidence provenance
    method: CDD
    threshold: 100
    required: true
    state: passing_local
    checks: [output-fields, evidence-provenance, no-action-boundary]
  - id: stage-1-infrastructure
    name: Namespace deployment and isolation
    method: EDD
    threshold: 100
    required: true
    state: cluster_smoke_isolation_cleanup_passed
    checks: [ubi-image, compose-stack, helm-render, network-policy, cleanup]
  - id: stage-2-unit
    name: Deterministic investigation
    method: TDD
    threshold: 100
    required: true
    state: passing_local
    checks: [distinct-causes, abstention, human-review]
  - id: stage-3-integration
    name: MCP, retrieval, API, and optional model
    method: EDD
    threshold: 90
    required: true
    state: local_mcp_and_direct_model_synthetic_only
    checks: [http-journey, mcp-transport, retrieval, model-fallback]
  - id: stage-4-benchmarks
    name: Target model and capacity evidence
    method: BDD
    threshold: 100
    required: true
    state: target_capacity_unmeasured
    checks: [two-scenario-quality-review, one-five-twenty-five-seat-capacity]
  - id: stage-5-publication
    name: Publication and guided journey
    method: CBT
    threshold: 100
    required: true
    state: source_ready_launchpad_draft
    checks: [business-readme, antora-build, learner-artifact, claim-audit]
