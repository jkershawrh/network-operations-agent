name: Local proof
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v3.17.3
      - run: python -m pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run build:showroom
      - run: helm lint chart
      - run: make test-all
      - run: docker compose -f compose.yaml up --build --wait --wait-timeout 120
      - run: make smoke
      - if: always()
        run: docker compose -f compose.yaml down
