{{- $name := include "network-operations-agent.fullname" . -}}
{{- range $component := list "diagnostics" "app" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    app.kubernetes.io/name: network-operations-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ $.Release.Name }}
      app.kubernetes.io/component: {{ $component }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: network-operations-agent
        app.kubernetes.io/instance: {{ $.Release.Name }}
        app.kubernetes.io/component: {{ $component }}
    spec:
      automountServiceAccountToken: false
{{- if $.Values.image.pullSecret }}
      imagePullSecrets:
        - name: {{ $.Values.image.pullSecret | quote }}
{{- end }}
      containers:
        - name: {{ $component }}
{{- if $.Values.image.digest }}
          image: "{{ $.Values.image.repository }}@{{ $.Values.image.digest }}"
{{- else }}
          image: "{{ $.Values.image.repository }}:{{ $.Values.image.tag }}"
{{- end }}
          imagePullPolicy: {{ $.Values.image.pullPolicy }}
{{- if eq $component "diagnostics" }}
          command: ["python3", "-m", "network_ops.mcp_server"]
{{- else }}
          env:
            - name: NETWORK_OPS_MCP_URL
              value: "http://{{ $name }}-diagnostics:8095/mcp"
{{- if $.Values.lab.enabled }}
            - name: NETWORK_OPS_LAB_MODE
              value: "1"
{{- end }}
{{- if $.Values.model.existingSecret }}
            - name: NETWORK_OPS_MODEL_RUNTIME
              value: {{ $.Values.model.runtimeLabel | quote }}
            - name: NETWORK_OPS_MODEL_BASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.model.existingSecret | quote }}
                  key: {{ $.Values.model.secretKeys.endpoint | quote }}
            - name: NETWORK_OPS_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.model.existingSecret | quote }}
                  key: {{ $.Values.model.secretKeys.name | quote }}
            - name: NETWORK_OPS_MODEL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.model.existingSecret | quote }}
                  key: {{ $.Values.model.secretKeys.apiKey | quote }}
{{- end }}
{{- end }}
          ports:
            - name: http
              containerPort: {{ if eq $component "diagnostics" }}8095{{ else }}8080{{ end }}
          readinessProbe:
{{- if eq $component "app" }}
            httpGet:
              path: /ready
              port: http
{{- else }}
            tcpSocket:
              port: http
{{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
{{ toYaml $.Values.resources | indent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
{{- end }}
