{{- $name := include "network-operations-agent.fullname" . -}}
{{- range $component := list "diagnostics" "app" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}-{{ $component }}
  labels:
    app.kubernetes.io/name: network-operations-agent
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
spec:
  selector:
    app.kubernetes.io/instance: {{ $.Release.Name }}
    app.kubernetes.io/component: {{ $component }}
  ports:
    - name: http
      port: {{ if eq $component "diagnostics" }}8095{{ else }}8080{{ end }}
      targetPort: http
---
{{- end }}
