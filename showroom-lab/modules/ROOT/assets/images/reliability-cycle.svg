<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600" role="img" aria-labelledby="title desc">
  <title id="title">Reliability qualification cycle</title><desc id="desc">A cycle begins with a healthy baseline, introduces a controlled failure, observes evidence and gaps, applies fail-closed policy, verifies no action executed, and exports a qualification report before returning to baseline.</desc>
  <defs><style>.b{fill:#fff;stroke:#0066cc;stroke-width:3}.t{font:600 19px sans-serif;fill:#151515}.s{font:15px sans-serif;fill:#3c3f42}.a{fill:none;stroke:#0066cc;stroke-width:4;marker-end:url(#m)}</style><marker id="m" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#0066cc"/></marker></defs>
  <rect width="1200" height="600" fill="#fafafa"/><text x="600" y="42" text-anchor="middle" class="t" font-size="27">From a demo result to repeatable reliability evidence</text>
  <g transform="translate(470 85)"><rect width="260" height="90" rx="45" class="b"/><text x="130" y="38" text-anchor="middle" class="t">1. Healthy baseline</text><text x="130" y="64" text-anchor="middle" class="s">known cause + complete evidence</text></g>
  <g transform="translate(825 205)"><rect width="280" height="100" rx="12" class="b"/><text x="140" y="40" text-anchor="middle" class="t">2. Inject one failure</text><text x="140" y="68" text-anchor="middle" class="s">timeout, conflict, outage, malformed</text></g>
  <g transform="translate(760 400)"><rect width="300" height="100" rx="12" class="b"/><text x="150" y="40" text-anchor="middle" class="t">3. Observe behavior</text><text x="150" y="68" text-anchor="middle" class="s">evidence, unknowns, diagnosis</text></g>
  <g transform="translate(140 400)"><rect width="300" height="100" rx="12" class="b"/><text x="150" y="40" text-anchor="middle" class="t">4. Verify invariants</text><text x="150" y="68" text-anchor="middle" class="s">human approval; no execution</text></g>
  <g transform="translate(95 205)"><rect width="280" height="100" rx="12" class="b"/><text x="140" y="40" text-anchor="middle" class="t">5. Export proof</text><text x="140" y="68" text-anchor="middle" class="s">scorecard + hashes + brief</text></g>
  <path d="M720 135 C825 145 900 170 935 202" class="a"/><path d="M1030 305 C1035 345 1005 380 965 397" class="a"/><path d="M760 460 C650 530 535 530 440 460" class="a"/><path d="M210 400 C165 365 160 330 190 306" class="a"/><path d="M310 205 C350 165 405 145 470 136" class="a"/>
  <text x="600" y="570" text-anchor="middle" class="s">The cycle is deterministic and repeatable; it does not claim autonomous remediation or production readiness.</text>
</svg>
