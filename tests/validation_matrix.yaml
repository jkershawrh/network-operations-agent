    state: passing_local
    criteria:
      output_fields: "Every result contains quickstart contract output fields."
      evidence_provenance: "Accepted observations have timestamp, scope, signal, and provenance."
  stage_1_infrastructure:
    state: cluster_smoke_isolation_cleanup_passed
    criteria:
      local_image: "UBI image builds and fixture CLI runs; native arm64 image not verified."
      local_stack: "Two-service Compose stack and both end-to-end scenarios pass."
      cluster_deployment: "Pinned Quay image pulled in isolated OpenShift namespace; both pods ready and both scenarios pass through port-forward. Unrelated pod denied by NetworkPolicy; Helm uninstall and pull Secret cleanup passed."
